[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-structural-policy-divergence"
version = "0.1.0"
description = "Point-in-time G10 structural policy divergence research"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.scripts]
spd-phase01 = "fx_structural_policy_divergence.phase01_sources:main"
spd-phase02 = "fx_structural_policy_divergence.phase02_panel:main"
spd-phase03 = "fx_structural_policy_divergence.phase03_model:main"
spd-phase04 = "fx_structural_policy_divergence.phase04_fx:main"
spd-phase05 = "fx_structural_policy_divergence.phase05_gate:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
pretty = true
show_error_codes = true
